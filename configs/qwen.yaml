# Qwen-Image-2.1 Image-Edit configuration (Manga-Flux Pass2, experimental)
# Modelos: https://huggingface.co/abenzerps/Qwen-Image-2.1-Uncensored-GGUF
# NÃO usar Q8_0 (shape mismatch [136] vs [128] no ComfyUI).

model:
  unet_name: "qwen-image-2.1-Q4_K_M.gguf"          # -> ComfyUI/models/diffusion_models/
  clip_name: "qwen3vl_8b_int8_convrot.safetensors" # -> ComfyUI/models/text_encoders/ (type=qwen_image)
  vae_name: "qwen_image_2.1_vae_bf16.safetensors"  # -> ComfyUI/models/vae/

generation:
  steps: 25            # oficial 40-50; 25 para teste rápido na 3060
  cfg: 1.0             # caminho oficial Qwen; não subir sem negative prompt
  sampler_name: "euler"
  scheduler: "simple"
  resolution: 1024     # budget de pixels do TextEncodeQwenImage21
  custom_size: false   # false = canvas segue o latent do image_1
  width: 1024
  height: 1024
  max_ref_crops: 8     # image_3..image_10 (image_1=P&B, image_2=style)

prompt:
  # Template determinístico (sem Gemma por página). <image1>/<image2> são
  # obrigatórios; <crowps> e <palette> são preenchidos pelo orchestrator.
  template: "Colorize the black-and-white manga page in <image1> preserving exact lineart, panel layout and screentones. Use the color identity from <image2>.{crops}{palette} Flat anime colors, no photorealism, leave speech bubbles white."
  use_gemma_prompts: false  # opt-in do prompt modular legado (lento e instável)
  faiss_threshold: 0.35
  ref_crops_dir: ""         # override manual para teste A/B (--pass2-option ref_crops_dir=...)

backend:
  custom_nodes:
    - "https://github.com/leejet/ComfyUI-GGUF"  # ModelQwenImage; substitui city96
  comfy_args: "--lowvram"  # recomendado na RTX 3060 12GB
